name: Build and Deploy Root APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'PenOS-Launcher.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=PenOS,O=PenOS,C=CN"
          fi

      - name: Assemble Android 5.0+ (API 21) APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK to Repository Root
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PenOS-Launcher.apk
          ls -lh PenOS-Launcher.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenOS-Launcher-apk
          path: PenOS-Launcher.apk

      - name: Commit updated root APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f PenOS-Launcher.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update root PenOS-Launcher.apk [skip ci]"
            git push
          fi
